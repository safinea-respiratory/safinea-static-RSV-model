---
# ============================================================ #
# Configuration for the STATIC RSV model - IRELAND, 2023/24 - 2025/26
#
# Same code as the multi-country RespiCompass round; only the data and
# these settings differ. Run it with:
#
#     cfg <- load_config("config/ireland_2025_2026.yaml")
#
# The inputs are produced by scripts/adapt_irish_data.R from the
# confidential national extracts. Those extracts, and the two
# epidemiological files derived from them, are excluded from git - see
# .git/info/exclude. The births and population files are public.
#
# TWO THINGS DIFFER STRUCTURALLY FROM THE RESPICOMPASS ROUND:
#
#   1. The age split is 4-WEEKLY rather than one window per season.
#      That is strictly more information - the sampler constrains the
#      age mix every four weeks instead of once - so the draws are
#      tighter. No code changes: the sampler uses whatever windows it
#      is given.
#
#   2. Only six age bands, because that is what the data carries. The
#      model takes its bands from the data, so nothing breaks, but the
#      adult programme can only address "65+y" as a single block.
# ============================================================ #

countries:
  - {name: "Ireland", iso2: "IE"}


# ============================================================ #
# Input date formats
#
# adapt_irish_data.R writes ISO dates throughout. Declared explicitly
# because R's as.Date() turns an unexpected format into a year-1 date
# rather than NA, silently emptying every downstream join.
# ============================================================ #
input_date_formats:
  weekly_counts:    "%Y-%m-%d"
  burden_agegroups: "%Y-%m-%d"
  births:           "%Y-%m-%d"


# ============================================================ #
# Age groups
#
# Taken from the data; nothing here defines a band. The six below are
# what the Irish extract carries - coarser than RespiCompass's eleven,
# which is why adult targeting is all-or-nothing this round.
# ============================================================ #
age_group_aliases: {}

age_group_order: ["0-2mo", "3-5mo", "6-11mo", "1-4y", "5-64y", "65+y"]


# ============================================================ #
# INFANT PROGRAMME - birth dose
# ============================================================ #
infant_vaccination:

  vacc_IE:
    mean: 0.87
    sd:   0.026

  # Residual protection relative to the initial value: 1 = full, 0 =
  # none left. Bands absent from this list default to 0.
  waning_by_band:
    "0-2mo":  0.97
    "3-5mo":  0.72
    "6-11mo": 0.30
    "1-4y":   0.00

  age_bounds:
    "0-2mo":  [0,  3]
    "3-5mo":  [3,  6]
    "6-11mo": [6,  12]
    "1-4y":   [12, 60]

  # The infant programme STARTED IN AUTUMN 2024, so there are two
  # windows across the three modelled seasons. 2023/24 has none, and
  # infant bands simply pass through at their observed values there -
  # the model gets that for free, since a cohort born outside every
  # window has zero coverage.
  #
  # Windows must not overlap - uptake is set per window below.
  windows:
    start: ["2024-09-01", "2025-09-01"]
    end:   ["2025-02-28", "2026-02-28"]

  # Uptake ALREADY REFLECTED IN THE OBSERVED DATA. The scenario
  # machinery divides the observed admissions by
  # (1 - uptake x VE x waning) to recover a no-vaccination
  # counterfactual, then re-applies each scenario's uptake.
  #
  # 0.83 carried over from the previous Ireland round. CONFIRM THIS
  # BEFORE USING THE OUTPUT: it is not a neutral default. At 0.83 the
  # observed infant admissions are inflated to a counterfactual before
  # any scenario is applied, so every infant number moves.
  #
  # It now takes one value per window, so if the programme ran at a
  # lower rate in its first season - which a new programme usually does
  # - write that instead:
  #
  #     baseline_uptake: [0.70, 0.83]     # 2024/25, 2025/26
  baseline_uptake: 0.83


# ============================================================ #
# ADULT PROGRAMME - not in scope this round
#
# Kept wired but at zero coverage. With only "65+y" in the data it
# could not be age-targeted anyway; the RespiCompass round is where
# the finer bands live.
# ============================================================ #
adult_vaccination:
  eligible_age_groups: ["65+y"]
  waning_curves: "data/vaccine/waning_curves.csv"
  ve_target: "VE_sev"
  ve_beyond_curve: "zero"
  campaigns:
    - start:   "2025-10-05"
      end:     "2025-10-05"
      share:   1.0
      profile: "uniform"
  baseline_coverage: 0.00


# ============================================================ #
# INFANT CATCH-UP PROGRAMME - the point of this round
#
# A single-day campaign in AUTUMN 2025 - the third modelled season -
# vaccinating every child under six months old ON THAT DAY. Same vaccine
# as the birth dose, so it takes vacc_IE and waning_by_band from
# infant_vaccination above.
#
# That cohort - born roughly March to September 2025 - falls in the GAP
# between the two birth-dose windows, so it received no birth dose. The
# two programmes therefore reach different children and their coverage
# adds rather than double-counting.
#
# The cohort ages across bands as the season runs: it starts in "0-2mo"
# and "3-5mo" and ends almost entirely in "6-11mo".
# ============================================================ #
catchup_vaccination:

  age_at_campaign_months: [0, 6]

  # Every band the cohort can reach before the horizon ends. Dosed in
  # September 2025 at under six months, it is under 15 months old by the
  # last modelled week (2026-05-17), so "1-4y" is the last band needed.
  age_bounds:
    "0-2mo":  [0,  3]
    "3-5mo":  [3,  6]
    "6-11mo": [6,  12]
    "1-4y":   [12, 60]

  # Matched against week-ending dates, which are Sundays.
  campaigns:
    - start:   "2025-09-07"
      end:     "2025-09-07"
      share:   1.0
      profile: "uniform"

  # No catch-up campaign has actually run, so the observed data needs no
  # correction on this programme's account.
  baseline_coverage: 0.00


# ============================================================ #
# Scenarios
#
# "no_vacc" vaccinates nobody and is the REFERENCE every impact table
# differences against - the model requires exactly one such scenario.
# It is a counterfactual, not the observed data: the observed
# admissions already contain the birth-dose programme at
# baseline_uptake, so this scenario back-calculates them upward to what
# they would have been with no vaccination at all.
#
# "current" is what actually happens - the birth dose alone. The two
# catch-up arms add the September 2025 campaign on top of it. Reading
# "catchup_high" minus "current" gives the catch-up's own contribution;
# every impact table instead reports against "no_vacc".
#
# PROVISIONAL catch-up levels - these exercise the machinery but are
# not a decided scenario set. Replace once the real levels are agreed.
# ============================================================ #
scenarios:
  - id: "no_vacc"
    infant_uptake:    0.00
    adult_coverage:   0.00
    catchup_coverage: 0.00
  - id: "current"
    infant_uptake:    0.83
    adult_coverage:   0.00
    catchup_coverage: 0.00
  - id: "catchup_low"
    infant_uptake:    0.83
    adult_coverage:   0.00
    catchup_coverage: 0.20
  - id: "catchup_high"
    infant_uptake:    0.83
    adult_coverage:   0.00
    catchup_coverage: 0.70


# ============================================================ #
# Submission output
# ============================================================ #
round_id: "2025_2026_1_RSV_IRL"
submission_horizon_anchor: "2023-09-10"


# ============================================================ #
# Input files
# ============================================================ #
epi_weekly_file: "data/epidemiological/hospitaladmissions_IE.csv"
epi_burden_file: "data/epidemiological/hospitalburden_agegroups_IE.csv"
births_file:     "data/population/births_by_month_IE.csv"
population_file: "data/population/population_estimates_IE.csv"


# ============================================================ #
# Monte-Carlo settings
#
# The run spans AUTUMN 2023 TO SPRING 2026 - three contiguous seasons
# (2023/24, 2024/25, 2025/26). data_start is the first 4-week burden
# window at or after autumn 2023; both the weekly and the burden table
# are filtered on it and must stay aligned, which
# validate_data_start() checks by reporting both ranges.
#
# Earlier data exists (2018/19, 2019/20, 2022/23) but is not modelled:
# a 105-week surveillance hole runs from May 2020 to May 2022, so any
# horizon reaching back past it would be discontiguous.
# ============================================================ #
n_draws:    100
mc_seed:    123
data_start: "2023-09-10"
