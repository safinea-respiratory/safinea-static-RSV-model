---
# ============================================================ #
# Configuration for the STATIC (sampling-based) RSV model
#
# Loaded by launch.R, which produces the RespiCompass 2026/2027
# submission via fixed-margin Monte-Carlo sampling of the observed
# weekly + age-distributed RSV data, plus a vaccine coverage x
# effectiveness x waning correction per scenario.
#
# IMPORTANT: the infant and adult vaccination programmes are entirely
# INDEPENDENT - different products, different eligibility rules,
# different waning data, and different uncertainty models. They share
# no parameters. Each has its own block below.
# ============================================================ #

# ============================================================ #
# Countries
#
# The model runs once per country listed here and binds the results into
# a single submission table, distinguished by the `location` column.
#
# TWO identifiers are needed because RespiCompass is not internally
# consistent about country naming:
#   name - full name, used by target-data
#          (hospitaladmissions.csv, hospitalburden_agegroups.csv)
#   iso2 - two-letter code, used by auxiliary-data (births, population)
#          AND emitted as the submission's `location` column
#
# Unknown values are a hard error at load, listing what is available.
# ============================================================ #
# All 28 countries that have data in BOTH target-data and
# auxiliary-data, ordered by iso2. Comment out the ones you do not need;
# roughly 19 s per country.
#
# Iceland (IS) and Liechtenstein (LI) appear in auxiliary-data but have
# no hospitalisation data, so they cannot be modelled and are absent.
#
# Two names/codes do NOT follow the hub's own supporting-files mapping:
#   Czech Republic - the mapping file calls it "Czechia", but target-data
#                    uses "Czech Republic"
#   Greece         - auxiliary-data keys it as the Eurostat code EL, not
#                    the ISO code GR that the mapping file gives
# Both pairings were confirmed against population size.
countries:
  - {name: "Ireland",        iso2: "IE"}


# ============================================================ #
# Input date formats
#
# strptime codes for the date columns of each input CSV. Declared
# explicitly and parsed strictly, because R's as.Date() will happily
# turn "01/09/2025" into the year 1 without raising an error - it does
# NOT return NA. Any value that fails to parse, or lands outside a
# plausible year range, is a hard error.
# ============================================================ #
input_date_formats:
  weekly_counts: "%Y-%m-%d"    # hospitaladmissions.csv        -> target_end_date
  burden_agegroups: "%Y-%m-%d" # hospitalburden_agegroups.csv  -> start_date / end_date
  births: "%Y-%m-%d"           # births_by_month.csv           -> date


# ============================================================ #
# Age groups
#
# The model takes its age bands FROM THE DATA. Nothing in this file
# defines a band; the keys below only *reference* bands that must
# already be present in the epidemiological input. Any mismatch is a
# hard error at load time (see R/validate.R).
#
# The RespiCompass target data supplies 11 bands. The finer adult bands
# are what make an age-targeted adult campaign expressible: a 75+
# programme is ["75-79", "80+"], with no population-fraction fudge.
# ============================================================ #

# Optional. Renames source labels to the labels used throughout the
# model and in the submission `pop_group` column. Empty because the
# RespiCompass input already uses the submission's own labels.
age_group_aliases: {}

# Display order for plots. Optional, but worth setting: the fallback is
# alphabetical, which orders age bands wrongly.
age_group_order: ["0-2mo", "3-5mo", "6-11mo", "1-4y", "5-64y", "65+y"]


# ============================================================ #
# INFANT PROGRAMME - maternal / birth-dose product
#
# Protection is conferred at (or before) birth, so time-since-
# vaccination equals age. Waning is therefore indexed by AGE BAND.
# Eligibility is determined by whether a band's birth cohort falls
# inside a vaccination window.
# ============================================================ #
infant_vaccination:

  # Vaccine effectiveness. One draw per Monte-Carlo sample.
  # Values are given by the RespiCompass 2025/26 RSV round.
  vacc_IE:
    mean: 0.87
    sd:   0.026

  # Residual protection by age band, relative to the initial value.
  # 0 = no protection left, 1 = full initial protection.
  # Bands absent from this list default to 0 (no infant protection).
  waning_by_band:
    "0-2mo":  0.97
    "3-5mo":  0.72
    "6-11mo": 0.30
    "1-4y":   0.00

  # Age span of each band in MONTHS, [min inclusive, max exclusive].
  # Used to derive which birth cohort a band represents.
  #
  # List every band the programme has ever reached - INCLUDING bands
  # whose protection has fully waned (e.g. 1-4). These bounds also
  # drive the vaccinated / unvaccinated split, so dropping a fully-waned
  # band would silently change the immYes / immNo rows.
  age_bounds:
    "0-2mo":  [0,  3]
    "3-5mo":  [3,  6]
    "6-11mo": [6,  12]
    "1-4y":   [12, 60]

  # One entry per season the programme ran: every modelled season plus
  # the preceding one, since infants aged up to 4 years in a modelled
  # season may have been covered by an earlier season's programme.
  #
  # Windows must NOT overlap. Uptake is set per window below, so a birth
  # date falling inside two of them would have no single uptake and both
  # the coverage and the dose count would silently take the first match.
  # Checked at load.
  windows:
    start: ["2024-09-01", "2025-09-01"]
    end:   ["2025-02-28", "2026-02-28"]

  # Uptake reflected in the observed baseline data. The scenario
  # machinery back-calculates the no-vaccination counterfactual using
  # this value, then re-applies the scenario uptake.
  #
  # Accepts EITHER a single value applied to every window, OR one value
  # PER WINDOW, so a programme that ramped up over successive seasons can
  # be described as it actually happened:
  #
  #     baseline_uptake: [0.45, 0.83]     # first season, second season
  #
  # A birth cohort straddling two seasons then carries a blend of both
  # years' uptake, weighted by how much of the cohort falls in each -
  # which is what happens to a real cohort spanning a programme change.
  # Each scenario's infant_uptake takes the same two forms.
  #
  # ZERO for the 2026/27 round: the infant programme is not in scope, so
  # the observed data is taken at face value and infant age bands pass
  # through unchanged (the back-calculation denominator becomes 1).
  # The machinery is retained for future rounds - set this to the real
  # coverage and give scenarios a non-zero infant_uptake to re-enable it.
  baseline_uptake: [0.83, 0.83] 


# ============================================================ #
# ADULT PROGRAMME - separate product, separate schedule
#
# Protection is conferred at vaccination during a calendar campaign, so
# waning is indexed by MONTHS SINCE DOSE, not by age. Uncertainty comes
# from the 500-curve RespiCompass ensemble: each Monte-Carlo sample uses
# one entire curve. There is deliberately NO vacc_IE draw here - the
# ensemble already carries the uncertainty.
#
# ============================================================ #
adult_vaccination:

  # Age bands the adult programme covers. Must match bands present in
  # the data, and must not overlap the infant programme's bands.
  # Change this list to retarget the programme - e.g. ["75-79", "80+"]
  # for a 75+ campaign, with no population-fraction approximation.
  eligible_age_groups: ["65+y"]

  # Waning ensemble: 500 realisations of the VE-over-time curve.
  # Sample d uses rep d. See data/vaccine/README.md for provenance.
  waning_curves: "data/vaccine/waning_curves.csv"

  # Which VE column to use. VE_sev is unconditional protection against
  # RSV hospitalisation, so it is the correct multiplier for this
  # model's hospitalisation target. VE_inf is loaded but unused.
  ve_target: "VE_sev"

  # Protection beyond the last tabulated month (36):
  #   zero      - assume no residual protection
  #   hold_last - carry the final tabulated value forward
  ve_beyond_curve: "zero"

  # ---- Vaccination campaigns ----
  #
  # Coverage is ONE-OFF and CUMULATIVE. The adult product is a single
  # dose, so nobody is re-vaccinated: each campaign recruits from the
  # not-yet-vaccinated, and protection from an earlier campaign keeps
  # decaying along its own VE curve rather than resetting.
  #
  # This is the opposite of the infant programme, where each birth
  # cohort is newly eligible every season.
  #
  #   share   - this campaign's portion of the scenario's total target
  #             coverage. Shares must sum to 1 across campaigns.
  #             Omit on every campaign to split equally.
  #   profile - how coverage accrues WITHIN the window.
  #             "uniform" = equal increment each week.
  #
  campaigns:
    - start:   "2025-10-05"
      end:     "2025-10-05"
      share:   1.0
      profile: "uniform"

  # Cumulative coverage already reflected in the observed baseline data.
  # Zero: no adult RSV vaccination in the observed period.
  baseline_coverage: 0.00


# ============================================================ #
# INFANT CATCH-UP PROGRAMME - same vaccine, calendar campaign
#
# A one-off campaign that vaccinates children who are already some
# months old, rather than at birth. It is the SAME PRODUCT as the birth
# dose above, so it takes its effectiveness and waning from
# infant_vaccination (vacc_IE and waning_by_band) and has no VE settings
# of its own. Only the elderly vaccine, a different product, uses the
# sampled curves in data/vaccine/waning_curves.csv.
#
# What differs from the birth dose is the CLOCK. A birth dose is given at
# age zero, so age and time-since-dose are the same number and waning can
# be read straight off the age band. A catch-up dose is given on a date
# to children who are already months old, which separates the two:
#
#   eligibility  an age range ON THE DAY OF THE DOSE - a birth cohort,
#                which then ages ACROSS bands as the season runs. For an
#                under-6-months campaign, "0-2mo" is fully covered on
#                campaign day and empty three months later, while
#                "6-11mo" fills up as the cohort arrives in it.
#   waning       months since the dose, not age.
#
# This is why it cannot be expressed as another eligible_age_groups list:
# no static set of bands describes a group that moves between them.
# ============================================================ #
catchup_vaccination:

  # Age range eligible on the day of the dose, [min, max) in MONTHS.
  # [0, 6] is "every child under six months old that day".
  age_at_campaign_months: [0, 6]

  # Every band the cohort can occupy over the modelled horizon - not just
  # the ones it starts in. An under-6-months cohort reaches "6-11mo"
  # within the season and "1-4" in the one after, so all four are needed.
  # A band omitted here silently receives no protection, so
  # validate_catchup_config() checks the span reaches the horizon.
  age_bounds:
    "0-2mo":  [0,  3]
    "3-5mo":  [3,  6]
    "6-11mo": [6,  12]
    "1-4y":   [12, 60]

  # One-off campaign. Matched against week-ending dates (Sundays), so a
  # window landing on any other weekday is a hard error.
  #
  # Dated to the start of the SECOND modelled season deliberately: the
  # cohort for a campaign at the start of season one was born from
  # March 2026, and this dataset's births only begin 2026-09-01, so its
  # doses could not be counted. A campaign here has full birth coverage.
  campaigns:
    - start:   "2025-09-07"
      end:     "2025-09-07"
      share:   1.0
      profile: "uniform"

  # Catch-up coverage already reflected in the observed data. Zero: no
  # such campaign has run, so the observed admissions need no
  # back-calculation on this programme's account.
  baseline_coverage: 0.00

# ============================================================ #
# Scenarios
#
# One entry per submitted scenario. `id` becomes the submission's
# scenario_id, and each scenario sets the uptake for BOTH programmes -
# they are independent, so any combination is expressible.
#
# infant_uptake     fraction of the eligible birth cohort vaccinated
# adult_coverage    cumulative fraction of the adult eligible bands
#                   vaccinated across all campaigns
# adult_age_groups  OPTIONAL. Which bands the adult programme targets in
#                   THIS scenario. Omit to inherit
#                   adult_vaccination.eligible_age_groups. Use it to
#                   compare targeting strategies at the same coverage:
#
#                     - id: "target_75plus"
#                       infant_uptake:    0.00
#                       adult_coverage:   0.70
#                       adult_age_groups: ["75-79", "80+"]
#
#                   Every band named here must exist in the data, must
#                   not overlap the infant programme, and must be present
#                   in the population file - all checked at load.
#
# catchup_coverage  OPTIONAL, defaults to 0. Fraction of the eligible
#                   birth cohort vaccinated by the catch-up campaign.
#                   Omitting it everywhere leaves the programme switched
#                   off and the model behaves exactly as before.
#
# 2026/27 round: adult vaccination of 65+ at three uptake levels, against
# a no-vaccination reference. Infant uptake is zero throughout - the
# infant programme is out of scope this round but kept wired for later.
#
# PROVISIONAL: the catch-up levels below mirror the adult ones purely so
# the machinery is exercised end to end. They are NOT a decided scenario
# set - replace them once the real uptake levels are agreed.
# ============================================================ #
scenarios:

  # The zero-vaccination REFERENCE. Every impact table differences
  # against it, and the model requires exactly one such scenario. It is
  # a counterfactual, not the observed data: the observed admissions
  # already contain the birth dose at baseline_uptake and a catch-up at
  # baseline_coverage, so this arm back-calculates them upward to what
  # they would have been with no vaccination at all.
  - id: "no_vacc"
    infant_uptake:    0.00
    adult_coverage:   0.00
    catchup_coverage: 0.00

  # What actually happens: the birth dose at its real uptake, no
  # catch-up. The arms below add a catch-up on top of it, so the
  # difference from this one is the catch-up's own contribution.
  - id: "current"
    infant_uptake:    [0.83, 0.87]
    adult_coverage:   0.00
    catchup_coverage: 0.53
  - id: "catch_up_40"
    infant_uptake:    [0.83, 0.87]
    adult_coverage:   0.00
    catchup_coverage: 0.40
  - id: "catch_up_60"
    infant_uptake:    [0.83, 0.87]
    adult_coverage:   0.00
    catchup_coverage: 0.60
  - id: "catch_up_80"
    infant_uptake:    [0.83, 0.87]
    adult_coverage:   0.00
    catchup_coverage: 0.80
  - id: "infant_90"
    infant_uptake:    [0.83, 0.90]
    adult_coverage:   0.00
    catchup_coverage: 0.53



# ============================================================ #
# Submission output
# ============================================================ #
# Round identifier and anchor date used to compute the `horizon`
# column (weeks since the anchor) in the RespiCompass submission file.
# The anchor is the first modelled week-ending date, so `horizon`
# starts at 0. Matches the convention used in the previous round.
#
# NOTE: round_id carries no country suffix. hub-config/tasks.json makes
# `location` a submission column, so the country is identified there
# rather than in round_id.
round_id: "2025_2026_1_RSV_IRL"
submission_horizon_anchor: "2023-09-10"


# ============================================================ #
# Births data
# ============================================================ #
# RespiCompass auxiliary-data supplies monthly births already mapped
# onto the 2026-09 .. 2027-08 scenario period for every country, so the
# previous forward-projection of a historical pattern is no longer
# needed and has been removed.
births_file: "data/population/births_by_month_IE.csv"

# Population by country x age band. The denominator for the adult
# administered-doses track: weekly adult doses are that week's coverage
# increment times the combined population of the eligible bands. Every
# band in adult_vaccination.eligible_age_groups must be present here for
# every configured country, or the denominator would silently be too
# small - checked at load.
population_file: "data/population/population_estimates_IE.csv"

# ---- Epidemiological inputs ----
# The *_2seasons files are DERIVED, not upstream: season 2 duplicates
# season 1 shifted forward 364 days, generated by
# scripts/make_two_seasons.R. Point these at the unsuffixed files to run
# the single upstream season instead.
epi_weekly_file: "data/epidemiological/hospitaladmissions_IE.csv"
epi_burden_file: "data/epidemiological/hospitalburden_agegroups_IE.csv"


# ============================================================ #
# Monte-Carlo settings
# ============================================================ #
# Number of draws per time point and RNG seed for reproducibility.
# n_draws must not exceed the number of reps in the waning ensemble.
#
# data_start drops earlier data points. Note it is effectively
# ALL-OR-NOTHING with this input: the burden file holds a single
# season-long window per age band (2026-08-31 .. 2027-08-29), so any
# value AFTER the window start discards the entire age-stratified table
# and the sampler has nothing to draw from. Keep it at or before the
# burden window start; it is checked at load.
n_draws:    10
mc_seed:    123
data_start: "2023-09-10"
