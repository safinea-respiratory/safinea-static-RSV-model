---
# ============================================================ #
# Configuration for the STATIC (sampling-based) RSV model
#
# Loaded by launch.R, which produces the RespiCompass 2026/2027
# submission via fixed-margin Monte-Carlo sampling of the observed
# weekly + age-distributed RSV data, plus a vaccine coverage x
# effectiveness x waning correction per scenario.
#
# IMPORTANT: the infant and adult vaccination programmes are entirely
# INDEPENDENT - different products, different eligibility rules,
# different waning data, and different uncertainty models. They share
# no parameters. Each has its own block below.
# ============================================================ #

# ============================================================ #
# Countries
#
# The model runs once per country listed here and binds the results into
# a single submission table, distinguished by round_id.
#
# `name` must match the `country` column of both epidemiological input
# files (28 EU/EEA countries are available); `code` is substituted into
# round_id_template. Unknown names are a hard error at load, listing
# what is available.
# ============================================================ #
countries:
  - {name: "Ireland", code: "IRL"}

# round_id per country. "{code}" is replaced by each country's code.
round_id_template: "2026_2027_1_RSV_{code}"

# The administered_doses target needs monthly births for each country,
# and the births file currently covers Ireland only. For a country with
# no births data:
#   error - stop with a message naming the country (default)
#   skip  - warn, and omit that country's administered_doses rows.
#           Its rsv_hospitalisations rows are unaffected.
missing_births: "error"


# ============================================================ #
# Input date formats
#
# strptime codes for the date columns of each input CSV. Declared
# explicitly and parsed strictly, because R's as.Date() will happily
# turn "01/09/2025" into the year 1 without raising an error - it does
# NOT return NA. Any value that fails to parse, or lands outside a
# plausible year range, is a hard error.
# ============================================================ #
input_date_formats:
  weekly_counts: "%Y-%m-%d"    # hospitaladmissions.csv        -> target_end_date
  burden_agegroups: "%Y-%m-%d" # hospitalburden_agegroups.csv  -> start_date / end_date


# ============================================================ #
# Age groups
#
# The model takes its age bands FROM THE DATA. Nothing in this file
# defines a band; the keys below only *reference* bands that must
# already be present in the epidemiological input. Any mismatch is a
# hard error at load time (see R/validate.R).
#
# The RespiCompass target data supplies 11 bands. The finer adult bands
# are what make an age-targeted adult campaign expressible: a 75+
# programme is ["75-79", "80+"], with no population-fraction fudge.
# ============================================================ #

# Optional. Renames source labels to the labels used throughout the
# model and in the submission `pop_group` column. Empty because the
# RespiCompass input already uses the submission's own labels.
age_group_aliases: {}

# Display order for plots. Optional, but worth setting: the fallback is
# alphabetical, which orders age bands wrongly.
age_group_order: ["0-2mo", "3-5mo", "6-11mo", "1-4", "5-17", "18-59",
                  "60-64", "65-69", "70-74", "75-79", "80+"]


# ============================================================ #
# INFANT PROGRAMME - maternal / birth-dose product
#
# Protection is conferred at (or before) birth, so time-since-
# vaccination equals age. Waning is therefore indexed by AGE BAND.
# Eligibility is determined by whether a band's birth cohort falls
# inside a vaccination window.
# ============================================================ #
infant_vaccination:

  # Vaccine effectiveness. One draw per Monte-Carlo sample.
  # Values are given by the RespiCompass 2025/26 RSV round.
  vacc_IE:
    mean: 0.87
    sd:   0.026

  # Residual protection by age band, relative to the initial value.
  # 0 = no protection left, 1 = full initial protection.
  # Bands absent from this list default to 0 (no infant protection).
  waning_by_band:
    "0-2mo":  0.97
    "3-5mo":  0.72
    "6-11mo": 0.30
    "1-4":    0.00

  # Age span of each band in MONTHS, [min inclusive, max exclusive].
  # Used to derive which birth cohort a band represents.
  #
  # List every band the programme has ever reached - INCLUDING bands
  # whose protection has fully waned (e.g. 1-4). These bounds also
  # drive the vaccinated / unvaccinated split, so dropping a fully-waned
  # band would silently change the immYes / immNo rows.
  age_bounds:
    "0-2mo":  [0,  3]
    "3-5mo":  [3,  6]
    "6-11mo": [6,  12]
    "1-4":    [12, 60]

  # Vaccination windows, one entry per season: the modelled 2026/27
  # season plus the preceding one, since infants aged up to 4 years in
  # 2026/27 may have been covered by an earlier season's programme.
  windows:
    start: ["2025-09-01", "2026-09-01"]
    end:   ["2026-02-28", "2027-02-28"]

  # Uptake reflected in the observed baseline data. The scenario
  # machinery back-calculates the no-vaccination counterfactual using
  # this value, then re-applies the scenario uptake.
  baseline_uptake: 0.83

  # Per-scenario uptake in the eligible group(s).
  scenarios:
    no_vacc:   0.00
    high_vacc: 0.95


# ============================================================ #
# ADULT PROGRAMME - separate product, separate schedule
#
# Protection is conferred at vaccination during a calendar campaign, so
# waning is indexed by MONTHS SINCE DOSE, not by age. Uncertainty comes
# from the 500-curve RespiCompass ensemble: each Monte-Carlo sample uses
# one entire curve. There is deliberately NO vacc_IE draw here - the
# ensemble already carries the uncertainty.
#
# NOT YET WIRED INTO THE MODEL. The curves are loaded and validated,
# but no adult vaccination effect is applied yet.
# ============================================================ #
adult_vaccination:

  # Age bands the adult programme covers. Must match bands present in
  # the data, and must not overlap the infant programme's bands.
  # Change this list to retarget the programme - e.g. ["75-79", "80+"]
  # for a 75+ campaign, with no population-fraction approximation.
  eligible_age_groups: ["65-69", "70-74", "75-79", "80+"]

  # Waning ensemble: 500 realisations of the VE-over-time curve.
  # Sample d uses rep d. See data/vaccine/README.md for provenance.
  waning_curves: "data/vaccine/waning_curves.csv"

  # Which VE column to use. VE_sev is unconditional protection against
  # RSV hospitalisation, so it is the correct multiplier for this
  # model's hospitalisation target. VE_inf is loaded but unused.
  ve_target: "VE_sev"

  # Protection beyond the last tabulated month (36):
  #   zero      - assume no residual protection
  #   hold_last - carry the final tabulated value forward
  ve_beyond_curve: "zero"

  # ---- Vaccination campaigns ----
  #
  # Coverage is ONE-OFF and CUMULATIVE. The adult product is a single
  # dose, so nobody is re-vaccinated: each campaign recruits from the
  # not-yet-vaccinated, and protection from an earlier campaign keeps
  # decaying along its own VE curve rather than resetting.
  #
  # This is the opposite of the infant programme, where each birth
  # cohort is newly eligible every season.
  #
  #   share   - this campaign's portion of the scenario's total target
  #             coverage. Shares must sum to 1 across campaigns.
  #             Omit on every campaign to split equally.
  #   profile - how coverage accrues WITHIN the window.
  #             "uniform" = equal increment each week.
  #
  campaigns:
    - start:   "2026-09-01"
      end:     "2026-11-30"
      share:   1.0
      profile: "uniform"

  # Cumulative coverage already reflected in the observed baseline data.
  # Zero at present: no adult RSV vaccination in the observed period.
  baseline_coverage: 0.00

  # Total cumulative coverage of the eligible population, per scenario.
  scenarios:
    no_vacc:   0.00
    high_vacc: 0.75


# ============================================================ #
# Submission output
# ============================================================ #
# Round identifier and anchor date used to compute the `horizon`
# column (weeks since the anchor) in the RespiCompass submission file.
# The anchor is the first modelled week-ending date, so `horizon`
# starts at 0. Matches the convention used in the previous round.
# round_id is built per country from round_id_template above.
submission_horizon_anchor: "2026-09-06"


# ============================================================ #
# Births data
# ============================================================ #
# Real births data is only available pre-2024 at time of writing.
# The static model projects the 2023 monthly pattern forward to
# 2024-2026 as a placeholder (assumes year-on-year stability in the
# seasonal birth pattern). Replace with projected births when they
# become available.
# TODO: replace with real / projected birth series for 2024-2026.
births_data_cutoff: "2024-01-01"
births_project_years: [2024, 2025, 2026, 2027]


# ============================================================ #
# Monte-Carlo settings
# ============================================================ #
# Number of draws per time point and RNG seed for reproducibility.
# n_draws must not exceed the number of reps in the waning ensemble.
# Data start date filters out all earlier data points.
n_draws:    100
mc_seed:    123
data_start: "2026-08-01"
